
name: Build EditPro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EditProAndroid_Native_Kotlin_Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract native project
        run: |
          mkdir -p /tmp/editpro
          unzip -q EditProAndroid_Native_Kotlin_Project.zip -d /tmp/editpro

          PROJECT_FILE=$(find /tmp/editpro -type f -name settings.gradle.kts -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "No settings.gradle.kts found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EditPro-debug-APK
          path: /tmp/editpro/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
