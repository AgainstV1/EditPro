
name: Build EditPro APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Normalize Android project folders
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle.kts || ! -f app/build.gradle.kts ]]; then
            echo "::error::Android project build files are missing."
            exit 1
          fi

          if [[ -d app/scr/main && ! -d app/src/main ]]; then
            mkdir -p app/src
            mv app/scr/main app/src/main
          fi

          if [[ -d app/scr/Test/Java && ! -d app/src/test/java ]]; then
            mkdir -p app/src/test
            mv app/scr/Test/Java app/src/test/java
          fi

          if [[ -d app/src/main/Res ]]; then
            mv app/src/main/Res app/src/main/res
          fi

          if [[ -d app/src/main/res/Values ]]; then
            mv app/src/main/res/Values app/src/main/res/values
          fi

          if [[ ! -f app/src/main/AndroidManifest.xml ]]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EditPro-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
